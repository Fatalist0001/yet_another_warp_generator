name: warpgen_gui
description: Material You интерфейс к локальному CLI warpgen (Linux/Windows).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: FiraMono
      fonts:
        - asset: assets/fonts/FiraMono-Regular.otf
          weight: 400
        - asset: assets/fonts/FiraMono-Medium.otf
          weight: 500
        - asset: assets/fonts/FiraMono-Bold.otf
          weight: 700
